<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pane 1 - Portal Links</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; /* シンプルな白背景 */
            color: #333;
            margin: 0;
            padding: 6px 8px 6px 3px; /* 左右に少し物理余白（右8px、左3px）を設けて、スプリッター重なり回避と美観を両立 */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* 固定幅なのでスクロールバーを完全になしにする */
        }
        .container {
            background-color: transparent; /* 装飾枠・影をすべて削除 */
            border: none;
            box-shadow: none;
            padding: 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 100px; /* スプリッターの幅を考慮し、最小幅を 100px に微調整 */
            width: 100%; /* 左右の余白はbodyのpaddingで綺麗にとるため、コンテナは100%幅にする */
        }
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .portal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 4px 2px; /* パディングをさらに小さく */
            text-decoration: none;
            color: #1e293b;
            font-weight: bold;
            font-size: 12px; /* ボタンのフォントサイズを一回り小さく（13pxから12pxに） */
            transition: all 0.2s ease;
            box-sizing: border-box;
            height: 30px; /* ボタンの高さを一回り小さく（34pxから30pxに） */
        }
        .portal-btn:hover {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #2563eb;
        }
        input {
            width: 100%;
            padding: 6px 2px; /* 左右パディングを2pxに縮小し文字見切れを防止 */
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px; /* 元の見やすいサイズに戻す */
            text-align: center; /* 中央揃えで見やすく */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="link-list">
            <!-- 超コンパクト・リモコン型UI (縦一列に隙間なく収める) -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="font-size: 13px; font-weight: bold; color: #1e293b; text-align: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">🗺️ 連携</div>
                
                <button class="portal-btn" id="btn-get-location" onclick="getLocation(event)" style="width: 95%; background-color: #22c55e; color: white; border-color: #16a34a; cursor: pointer;" title="位置情報を取得">
                    取得
                </button>

                <div id="manual-inputs" style="display: flex; flex-direction: column; gap: 6px; width: 95%; cursor: pointer;" onclick="showAutoSync()" title="クリックで自動同期へ移行">
                    <div title="緯度">
                        <input type="text" id="input-lat" placeholder="Lat">
                    </div>
                    <div title="経度">
                        <input type="text" id="input-lng" placeholder="Lng">
                    </div>
                    <div title="縮尺 (Zoom)">
                        <input type="text" id="input-zoom" placeholder="Zoom">
                    </div>
                    <div title="傾斜 (Pitch)">
                        <input type="text" id="input-pitch" placeholder="Pitch">
                    </div>
                    <div title="方位 (Bearing)">
                        <input type="text" id="input-bearing" placeholder="Bearing">
                    </div>
                    <input type="hidden" id="input-alt" value="0">
                </div>

                <button class="portal-btn" id="auto-sync-btn" onclick="autoSync(event)" style="width: 95%; background-color: #22c55e; color: white; border-color: #16a34a; cursor: pointer; display: none;" title="現在のGISタブの座標を取得し、表示中のGISタブに反映します">
                    自動同期
                </button>

                <button class="portal-btn" id="btn-move-map" onclick="moveMap(event)" style="width: 95%; background-color: #3b82f6; color: white; border-color: #2563eb; cursor: pointer;" title="地図を移動">
                    移動
                </button>

                <div style="margin-top: 8px; width: 95%;">
                    <div>
                        <input type="text" id="input-gis-url" placeholder="GIS URL" title="GIS URL入力（クリックで貼り付け）" style="background-color: #f1f5f9; cursor: pointer;" onclick="pasteFromClipboard()" oninput="updateUrlTooltip()">
                    </div>
                </div>

                <!-- 画面2のシステム設定タブを開く固定ボタン -->
                <button class="portal-btn" onclick="openSettingsTab(event)" style="width: 95%; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="画面2でシステム設定を開く">
                    ⚙️ 設定
                </button>

                <div id="location-status" style="margin-top: 3px; font-size: 10px; color: #dc2626; display: none; text-align: center; word-break: break-all;"></div>

                <!-- 画面2で×により非表示にされたタブの一覧（クリックで画面2へ戻す） -->
                <div id="hidden-tabs-section" style="margin-top: 10px; width: 95%; display: none;">
                    <div style="font-size: 12px; font-weight: bold; color: #1e293b; text-align: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">📌 タブ</div>
                    <div id="hidden-tabs-list" style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Google Maps m 値 ↔ CANVAS zoom の換算定数（実測データ線形フィット）
        // CANVAS zoom = GM_M_TO_ZOOM_A - GM_M_TO_ZOOM_B * log2(m)
        // m = 2 ^ ((GM_M_TO_ZOOM_A - zoom) / GM_M_TO_ZOOM_B)
        const GM_M_TO_ZOOM_A = 23.663;
        const GM_M_TO_ZOOM_B = 0.9561;

        function destinationPoint(lat, lng, distanceMeters, bearingDeg) {
            const R = 6371000;
            const lat1 = lat * Math.PI / 180;
            const lon1 = lng * Math.PI / 180;
            const brng = bearingDeg * Math.PI / 180;
            const dDivR = distanceMeters / R;
            const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dDivR) + Math.cos(lat1) * Math.sin(dDivR) * Math.cos(brng));
            const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(dDivR) * Math.cos(lat1), Math.cos(dDivR) - Math.sin(lat1) * Math.sin(lat2));
            return { lat: lat2 * 180 / Math.PI, lng: lon2 * 180 / Math.PI };
        }

        function normalizeHeading(deg) {
            let h = ((deg % 360) + 360) % 360;
            if (h > 180) h -= 360;
            return h;
        }

        function normalizeBearing(deg) {
            return ((deg % 360) + 360) % 360;
        }

        async function getTerrainElevation(lat, lng) {
            const q = `${Number(lat).toFixed(6)},${Number(lng).toFixed(6)}`;
            try {
                const r = await fetch(`https://api.opentopodata.org/v1/srtm90m?locations=${q}`, { headers: { 'Accept': 'application/json' } });
                if (r.ok) {
                    const d = await r.json();
                    const e = d.results?.[0]?.elevation;
                    if (typeof e === 'number' && !isNaN(e)) return e;
                }
            } catch (e) {}
            try {
                const r = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${q}`, { headers: { 'Accept': 'application/json' } });
                if (r.ok) {
                    const d = await r.json();
                    const e = d.results?.[0]?.elevation;
                    if (typeof e === 'number' && !isNaN(e)) return e;
                }
            } catch (e) {}
            return 0;
        }

        function parseLocation(urlStr) {
            try {
                let lat = null, lng = null, zoom = null;

                // 1) Google Earth 形式: /@lat,lng,...,<altitude>a,<distance>d,35y,<heading>h,<tilt>t,...
                // Google Earth の lat/lng は LookAt ターゲット（画面中央）。カメラは t/h/d から逆算。
                const matchEarth = urlStr.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?).*?,(-?\d+(?:\.\d+)?)a,(\d+(?:\.\d+)?)d/);
                if (matchEarth) {
                    const targetLat = parseFloat(matchEarth[1]);
                    const targetLng = parseFloat(matchEarth[2]);
                    const a = parseFloat(matchEarth[3]) || 0;
                    const distance = parseFloat(matchEarth[4]) || 5000;
                    const pitchMatch = urlStr.match(/,(-?\d+(?:\.\d+)?)t/);
                    const bearingMatch = urlStr.match(/,(-?\d+(?:\.\d+)?)h/);
                    const t = pitchMatch ? parseFloat(pitchMatch[1]) : 0;
                    const h = bearingMatch ? parseFloat(bearingMatch[1]) : 0;
                    // カメラはターゲットから見て h+180 方向に、地面投影距離 d*sin(t) 離れている
                    const ground = distance * Math.sin(t * Math.PI / 180);
                    const cam = destinationPoint(targetLat, targetLng, ground, h + 180);
                    lat = Number(cam.lat).toFixed(6);
                    lng = Number(cam.lng).toFixed(6);
                    const H = distance * Math.cos(t * Math.PI / 180) + a;
                    // CANVAS pitch は水平線からの下向き角。Google Earth t は上方向からの角度。
                    const canvasPitch = 90 - t;
                    zoom = Number(25.2 - Math.log2(H)).toFixed(4);
                    const result = { lat, lng, zoom, originalUrl: urlStr };
                    if (pitchMatch) result.pitch = Number(canvasPitch).toFixed(2);
                    if (bearingMatch) result.bearing = Number(normalizeBearing(h)).toFixed(2);
                    result.alt = Number(a).toFixed(2);
                    return result;
                }

                // 2) 汎用 @ セグメント解析（Google Maps の多くの変種に対応）
                const atIndex = urlStr.indexOf('@');
                if (atIndex >= 0) {
                    // @ の直後から / または ? までを切り出す
                    const afterAt = urlStr.substring(atIndex + 1);
                    let cutPos = afterAt.search(/[/?#]/);
                    if (cutPos === -1) cutPos = afterAt.length;
                    const coordsPart = afterAt.substring(0, cutPos);
                    const parts = coordsPart.split(',');
                    if (parts.length >= 3) {
                        const maybeLat = parseFloat(parts[0]);
                        const maybeLng = parseFloat(parts[1]);
                        const maybeZoomOrMeters = parts[2];
                        if (!isNaN(maybeLat) && !isNaN(maybeLng)) {
                            lat = maybeLat.toFixed(6);
                            lng = maybeLng.toFixed(6);
                            const m = maybeZoomOrMeters.match(/^([0-9]+(?:\.\d+)?)([a-zA-Z]?)$/);
                            if (m) {
                                const val = parseFloat(m[1]);
                                const unit = (m[2] || '').toLowerCase();
                                if (unit === 'z' || unit === '') {
                                    zoom = Number(val).toFixed(4);
                                } else if (unit === 'm') {
                                    // Google Maps m 値 → CANVAS zoom（双方向で同じ定数使用）
                                    zoom = Number(GM_M_TO_ZOOM_A - GM_M_TO_ZOOM_B * Math.log2(val || 5000)).toFixed(4);
                                }
                            }
                            const result = { lat, lng, zoom, originalUrl: urlStr };
                            // Google Maps 2D / Yahoo Map は真上からの俯瞰（CANVAS pitch = 90°）として扱う
                            if (urlStr.includes('google.com/maps') || urlStr.includes('yahoo.co.jp')) {
                                result.pitch = '90.00';
                                result.bearing = '0.00';
                            }
                            return result;
                        }
                    }
                }

                // 3) Cesium ハッシュ形式: #lat=...&lon=...&zoom=...
                const matchLat = urlStr.match(/[#?&]lat=(-?\d+(?:\.\d+)?)/);
                const matchLon = urlStr.match(/[#?&]lon=(-?\d+(?:\.\d+)?)/);
                const matchZoom = urlStr.match(/[#?&](?:zoom|z)=(\d+(?:\.\d+)?)/);
                const matchHeight = urlStr.match(/[#?&]height=(-?\d+(?:\.\d+)?)/);
                if (matchLat && matchLon) {
                    lat = Number(matchLat[1]).toFixed(6);
                    lng = Number(matchLon[1]).toFixed(6);
                    if (matchZoom) {
                        zoom = Number(matchZoom[1]).toFixed(4);
                    } else if (matchHeight) {
                        // Re:Earth の height を地図ズームに近似変換
                        const height = parseFloat(matchHeight[1]);
                        // 同様の原理で距離->ズーム変換 (Google Earth に合わせた経験的変換)
                        const z = 27 - Math.log2(Math.max(1, height || 5000));
                        zoom = Number(z).toFixed(4);
                    } else {
                        zoom = "15.0000";
                    }
                    return { lat, lng, zoom, originalUrl: urlStr };
                }

                // 4) クエリパラメータ形式: ?lat=...&lon=...&zoom=... または CANVAS の ?latitude=...&longitude=...&zoom=...&pitch=...&bearing=...
                const qLat = urlStr.match(/[?&#](?:lat|latitude)=(-?\d+(?:\.\d+)?)/);
                const qLon = urlStr.match(/[?&#](?:lon|lng|longitude)=(-?\d+(?:\.\d+)?)/);
                const qZoom = urlStr.match(/[?&#](?:zoom|z)=(\d+(?:\.\d+)?)/);
                const qPitch = urlStr.match(/[?&#]pitch=(-?\d+(?:\.\d+)?)/);
                const qBearing = urlStr.match(/[?&#]bearing=(-?\d+(?:\.\d+)?)/);
                if (qLat && qLon) {
                    lat = Number(qLat[1]).toFixed(6);
                    lng = Number(qLon[1]).toFixed(6);
                    zoom = qZoom ? Number(qZoom[1]).toFixed(4) : "15.0000";
                    const result = { lat, lng, zoom, originalUrl: urlStr };
                    if (qPitch) result.pitch = Number(qPitch[1]).toFixed(2);
                    if (qBearing) result.bearing = Number(qBearing[1]).toFixed(2);
                    // Yahoo Map は平面表示なので常に pitch=90, bearing=0 とする
                    if (urlStr.includes('yahoo.co.jp')) {
                        result.pitch = '90.00';
                        result.bearing = '0.00';
                    }
                    return result;
                }

                return null;
            } catch (e) {
                return null;
            }
        }

        // クリップボードや任意テキストから緯度・経度・ズームを抽出するフォールバック
        function extractLatLngZoomFromText(text) {
            if (!text) return null;
            // 1) JSON内に lat/lng/zoom がある場合
            try {
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    try {
                        const obj = JSON.parse(jsonMatch[0]);
                        if (obj && (obj.lat || obj.latitude || obj.lng || obj.lon || obj.longitude)) {
                            const lat = (obj.lat ?? obj.latitude ?? obj.latitude ?? obj.lat) || obj.latitude || obj.lat;
                            const lng = (obj.lng ?? obj.lon ?? obj.longitude) || obj.lng || obj.lon;
                            const zoom = obj.zoom ?? obj.z ?? obj.level ?? null;
                            if (lat !== undefined && lng !== undefined) {
                                return { lat: Number(lat).toFixed(6), lng: Number(lng).toFixed(6), zoom: zoom ? String(zoom) : '' };
                            }
                        }
                    } catch(e) { /* ignore JSON parse errors */ }
                }
            } catch(e) {}

            // 2) クエリ文字列風: lat=..&lon=.. または lat:.., lon:..
            const kvLat = text.match(/(?:lat|latitude)[\s:=]*(-?\d+\.?\d+)/i);
            const kvLng = text.match(/(?:lon|lng|longitude)[\s:=]*(-?\d+\.?\d+)/i);
            const kvZoom = text.match(/(?:zoom|z)[\s:=]*(-?\d+\.?\d+)/i);
            const kvHeight = text.match(/(?:height)[\s:=]*(-?\d+\.?\d+)/i) || text.match(/[?&#]height=(-?\d+(?:\.\d+)?)/i);
            if (kvLat && kvLng) {
                let z = kvZoom ? String(kvZoom[1]) : '';
                if (!z && kvHeight) {
                    const h = parseFloat(kvHeight[1]);
                    const zz = 27 - Math.log2(Math.max(1, h || 5000));
                    z = Number(zz).toFixed(4);
                }
                const result = { lat: Number(kvLat[1]).toFixed(6), lng: Number(kvLng[1]).toFixed(6), zoom: z };
                if (text.includes('yahoo.co.jp') || text.includes('google.com/maps') || text.includes('maps.app.goo.gl')) {
                    result.pitch = '90.00';
                    result.bearing = '0.00';
                }
                return result;
            }

            // 3) テキスト中の浮動小数点数列から最初の2つを lat/lng として使う
            const nums = Array.from(text.matchAll(/-?\d+\.\d+/g)).map(m => m[0]);
            if (nums.length >= 2) {
                // 値の順序が lon,lat になっているケースもあるので、緯度の範囲で判定
                let a = Number(nums[0]);
                let b = Number(nums[1]);
                let lat = a, lng = b;
                if (Math.abs(a) > 90 && Math.abs(b) <= 90) {
                    // a は経度で範囲外 -> swap
                    lat = b; lng = a;
                }
                const maybeZoom = nums[2] ? String(nums[2]) : '';
                const result = { lat: Number(lat).toFixed(6), lng: Number(lng).toFixed(6), zoom: maybeZoom };
                if (text.includes('yahoo.co.jp') || text.includes('google.com/maps') || text.includes('maps.app.goo.gl')) {
                    result.pitch = '90.00';
                    result.bearing = '0.00';
                }
                return result;
            }

            // 4) 整数のみ（ズームなど）が混ざる場合は整数列を抽出して最後の数値をズームに使う
            const ints = Array.from(text.matchAll(/-?\d+/g)).map(m => m[0]);
            if (ints.length >= 2) {
                const a = Number(ints[0]);
                const b = Number(ints[1]);
                if (Math.abs(a) <= 90 && Math.abs(b) <= 180) {
                    const zoom = ints.length >= 3 ? String(ints[2]) : '';
                    const result = { lat: Number(a).toFixed(6), lng: Number(b).toFixed(6), zoom };
                    if (text.includes('yahoo.co.jp') || text.includes('google.com/maps') || text.includes('maps.app.goo.gl')) {
                        result.pitch = '90.00';
                        result.bearing = '0.00';
                    }
                    return result;
                }
            }

            return null;
        }

        async function getLocation(event, providedUrl = null) {
            if (event) event.preventDefault();
            const statusDiv = document.getElementById('location-status');
            statusDiv.style.display = 'none';

            // 指定URLまたはGIS URL入力欄を優先的にチェック
            const urlInput = document.getElementById('input-gis-url');
            const gisUrl = providedUrl || urlInput.value.trim();
            const autoSyncMode = !!providedUrl;
            
            if (gisUrl) {
                // 指定URLまたはGIS URL入力欄がある場合はそこから取得
                let loc = parseLocation(gisUrl);
                if (!loc) {
                    loc = extractLatLngZoomFromText(gisUrl);
                }
                
                if (loc) {
                    // Yahoo / Google Map は平面表示なので pitch=90, bearing=0 に固定
                    if (gisUrl.includes('yahoo.co.jp') || gisUrl.includes('google.com/maps') || gisUrl.includes('maps.app.goo.gl')) {
                        loc.pitch = '90.00';
                        loc.bearing = '0.00';
                    }
                    document.getElementById('input-lat').value = loc.lat;
                    document.getElementById('input-lng').value = loc.lng;
                    document.getElementById('input-zoom').value = loc.zoom || '';
                    document.getElementById('input-pitch').value = loc.pitch || '0.00';
                    document.getElementById('input-bearing').value = loc.bearing || '0.00';
                    document.getElementById('input-alt').value = loc.alt || '0.00';
                    // 取得完了後にGIS URL入力欄をクリア（手動取得時のみ）
                    if (!autoSyncMode) {
                        urlInput.value = '';
                        urlInput.title = 'GIS URL';
                        statusDiv.style.display = 'block';
                        statusDiv.style.color = '#15803d';
                        statusDiv.textContent = 'URLから座標を取得しました。';
                        setTimeout(() => { statusDiv.style.display = 'none'; }, 2000);
                    }
                    return;
                } else {
                    if (!autoSyncMode) {
                        statusDiv.style.display = 'block';
                        statusDiv.style.color = '#dc2626';
                        statusDiv.textContent = "GIS URLから位置情報を解析できませんでした。";
                    }
                    return;
                }
            }

            // GIS URL入力欄が空の場合は従来の方法で取得
            if (window.__TAURI__ && window.__TAURI__.core) {
                try {
                    // Re:Earth はプラグイン内でクリップボードへ permalink をコピーするため、
                    // アクティブが reearth の場合はクリップボードから読み取る（ユーザーの取得ボタン操作があるため許可あり）。
                    let url = '';
                    try {
                        const active = await window.__TAURI__.core.invoke('get_active_pane2');
                        if (active === 'reearth' && navigator.clipboard && navigator.clipboard.readText) {
                            try {
                                url = await navigator.clipboard.readText();
                            } catch (e) {
                                // 読み取り失敗したらフォールバックで通常の取得を試す
                                url = await window.__TAURI__.core.invoke('get_pane2_url');
                            }
                        } else {
                            url = await window.__TAURI__.core.invoke('get_pane2_url');
                        }
                    } catch (e) {
                        // Tauri呼び出し失敗時は従来の取得を試す
                        url = await window.__TAURI__.core.invoke('get_pane2_url');
                    }

                    let loc = parseLocation(url);
                    if (!loc) {
                        // 直接URL解析が失敗したら、クリップボード内の任意テキストから抽出を試みる
                        loc = extractLatLngZoomFromText(url);
                    }
                    if (loc) {
                        // Yahoo / Google Map は平面表示なので pitch=90, bearing=0 に固定
                        if (url.includes('yahoo.co.jp') || url.includes('google.com/maps') || url.includes('maps.app.goo.gl')) {
                            loc.pitch = '90.00';
                            loc.bearing = '0.00';
                        }
                        document.getElementById('input-lat').value = loc.lat;
                        document.getElementById('input-lng').value = loc.lng;
                        document.getElementById('input-zoom').value = loc.zoom || '';
                        document.getElementById('input-pitch').value = loc.pitch || '0.00';
                        document.getElementById('input-bearing').value = loc.bearing || '0.00';
                        document.getElementById('input-alt').value = loc.alt || '0.00';
                        statusDiv.style.display = 'none';
                    } else {
                        statusDiv.style.display = 'block';
                        statusDiv.style.color = '#dc2626';
                        statusDiv.innerHTML = `位置情報を解析できませんでした。<br><a href="${url}" target="_blank" style="color: #3b82f6;">${url}</a>`;
                    }
                } catch (e) {
                    statusDiv.style.display = 'block';
                    statusDiv.style.color = '#dc2626';
                    statusDiv.textContent = "位置情報の取得に失敗しました: " + e;
                }
            } else {
                statusDiv.style.display = 'block';
                statusDiv.style.color = '#dc2626';
                statusDiv.textContent = "Tauri環境で実行してください。";
            }
        }

                statusDiv.style.color = '#dc2626';

        async function moveMap(event, simulatedCurrentUrl = null) {
            if (event) event.preventDefault();
            const statusDiv = document.getElementById('location-status');
            
            const lat = document.getElementById('input-lat').value.trim();
            const lng = document.getElementById('input-lng').value.trim();
            let zoom = document.getElementById('input-zoom').value.trim();
            if (!zoom) zoom = '15'; // デフォルト

            if (!lat || !lng) {
                statusDiv.style.display = 'block';
                statusDiv.style.color = '#dc2626';
                statusDiv.textContent = "緯度と経度を入力してください。";
                return;
            }

            if (window.__TAURI__ && window.__TAURI__.core) {
                try {
                    // 判定: 現在または切り替え先のアクティブタブ種別を問い合わせ（reearth のときはクリップボードへコピー）
                    let activeTab = '';
                    if (simulatedCurrentUrl) {
                        // タブ切り替え時はダミーURLからタブ種別を判定
                        if (simulatedCurrentUrl.includes('reearth.io') || simulatedCurrentUrl.includes('visualizer.reearth')) {
                            activeTab = 'reearth';
                        }
                    } else {
                        try {
                            activeTab = await window.__TAURI__.core.invoke('get_active_pane2');
                        } catch (e) { /* ignore */ }
                    }

                    // Re:Earth タブがアクティブな場合は Re:Earth 用 URL を組み立ててクリップボードへコピー
                    if (activeTab === 'reearth') {
                        try {
                            const base = (localStorage.getItem('reearth_url') || 'https://reearth.io/').split('?')[0];
                            // height を zoom から逆算
                            const height = Math.pow(2, 27 - Number(zoom));
                            const reearthUrl = `${base}?lat=${lat}&lng=${lng}&height=${Number(height).toFixed(4)}&heading=0&pitch=-90`;
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                await navigator.clipboard.writeText(reearthUrl);
                                statusDiv.style.display = 'block';
                                statusDiv.style.color = '#15803d';
                                statusDiv.textContent = 'Re:Earth 用 URL をクリップボードへコピーしました。プラグインで貼り付けてください。';
                                setTimeout(() => { statusDiv.style.display = 'none'; }, 2500);
                                return;
                            } else {
                                // フォールバック: Rust 経由でクリップボードに書き込むことも可能だが、ここでは通知する
                                statusDiv.style.display = 'block';
                                statusDiv.style.color = '#dc2626';
                                statusDiv.textContent = 'クリップボードへコピーできませんでした。ブラウザの権限を確認してください。';
                                return;
                            }
                        } catch (e) {
                            statusDiv.style.display = 'block';
                            statusDiv.style.color = '#dc2626';
                            statusDiv.textContent = 'Re:Earth URL の生成/コピーに失敗しました: ' + e;
                            return;
                        }
                    }

                    // デフォルトはGoogle Maps 等へ遷移
                    // 現在画面2で開いている地図サービスを判定（タブ切り替え時はダミーURLで上書き）
                    let currentUrlStr = simulatedCurrentUrl || "";
                    if (!currentUrlStr) {
                        try {
                            currentUrlStr = await window.__TAURI__.core.invoke('get_pane2_url');
                        } catch(err) {}
                    }

                    // デフォルトはGoogle Maps
                    let targetUrl = `https://www.google.com/maps/@${lat},${lng},${zoom}z`;

                    try {
                        if (currentUrlStr) {
                            // URLオブジェクトパース前の生文字列（currentUrlStr）によるより確実なサービス判定
                            if (currentUrlStr.includes('yahoo.co.jp')) {
                                // Yahoo 地図 2D 用：提供された 4 ペアに基づく H_y と z_yahoo
                                let rawPitch = document.getElementById('input-pitch').value.trim() || '0.00';
                                let rawBearing = document.getElementById('input-bearing').value.trim() || '0.00';
                                const pitch = isNaN(Number(rawPitch)) ? 0 : Number(rawPitch);
                                const bearing = isNaN(Number(rawBearing)) ? 0 : Number(rawBearing);
                                let targetLat = Number(lat);
                                let targetLng = Number(lng);
                                const log2H_y = -0.0687 * Math.pow(Number(zoom), 2) + 0.4568 * Number(zoom) + 18.0562;
                                // Yahoo 用 H も CANVAS 実測補正 0.83 を適用
                                const H_y = Math.pow(2, log2H_y) * 0.83;
                                let ground = 0;
                                if (pitch > 0.01 && pitch < 89.99) {
                                    // 標高 0m で仮ターゲットを求め、その点の標高を取得してから ground を再計算
                                    const ground0 = H_y / Math.tan(pitch * Math.PI / 180);
                                    let terrainAlt = 0;
                                    if (ground0 > 0) {
                                        const target0 = destinationPoint(Number(lat), Number(lng), ground0, bearing);
                                        terrainAlt = await getTerrainElevation(target0.lat, target0.lng);
                                    }
                                    const H_effective = Math.max(0, H_y - terrainAlt);
                                    ground = H_effective / Math.tan(pitch * Math.PI / 180);
                                }
                                if (ground > 0) {
                                    const target = destinationPoint(Number(lat), Number(lng), ground, bearing);
                                    targetLat = target.lat;
                                    targetLng = target.lng;
                                }
                                const zY = Math.max(8, Math.round(Number(zoom) + 0.2));
                                targetUrl = `https://map.yahoo.co.jp/?lat=${Number(targetLat).toFixed(8)}&lon=${Number(targetLng).toFixed(8)}&zoom=${zY}`;
                            } else if (currentUrlStr.includes('earth.google.com')) {
                                // Google Earth 用：入力 lat/lng はカメラ（オービット）位置。
                                // テレイン高さを取得して、視線とテレインの交点（LookAt ターゲット）を算出。
                                // そのターゲットとテレイン高さから、Google Earth の a/d/h/t を再構成する。
                                let rawPitch = document.getElementById('input-pitch').value.trim() || '0.00';
                                let rawBearing = document.getElementById('input-bearing').value.trim() || '0.00';
                                const pitch = isNaN(Number(rawPitch)) ? 0 : Number(rawPitch);
                                const bearing = isNaN(Number(rawBearing)) ? 0 : Number(rawBearing);
                                let t = 90 - pitch;
                                if (t < 0) t = 0;
                                if (t > 89.9) t = 89.9;
                                const tRad = t * Math.PI / 180;
                                const H = Math.pow(2, 25.2 - Number(zoom));
                                // 一旦標高 0m で仮ターゲットを求め、その地点の標高を取得する
                                const ground0 = H * Math.tan(tRad);
                                const target0 = destinationPoint(Number(lat), Number(lng), ground0, bearing);
                                const terrainAlt = await getTerrainElevation(target0.lat, target0.lng);
                                // テレイン高さを考慮して実際のターゲットを再計算
                                const camAltAboveTerrain = Math.max(1, H - terrainAlt);
                                const ground = camAltAboveTerrain * Math.tan(tRad);
                                const target = destinationPoint(Number(lat), Number(lng), ground, bearing);
                                const distanceNum = camAltAboveTerrain / Math.cos(tRad);
                                const tStr = t.toFixed(2);
                                const h = normalizeHeading(bearing).toFixed(2);
                                targetUrl = `https://earth.google.com/web/@${Number(target.lat).toFixed(8)},${Number(target.lng).toFixed(8)},${Number(terrainAlt).toFixed(2)}a,${distanceNum.toFixed(2)}d,35y,${h}h,${tStr}t,0r`;
                            } else if (currentUrlStr.includes('www.google.com/maps')) {
                                // Google Maps 2D 用：画面1のオービット位置から CANVAS テレイン上のターゲットを算出
                                let rawPitch = document.getElementById('input-pitch').value.trim() || '0.00';
                                let rawBearing = document.getElementById('input-bearing').value.trim() || '0.00';
                                const pitch = isNaN(Number(rawPitch)) ? 0 : Number(rawPitch);
                                const bearing = isNaN(Number(rawBearing)) ? 0 : Number(rawBearing);
                                let targetLat = Number(lat);
                                let targetLng = Number(lng);
                                // CANVAS の換算縮尺に基づくカメラ高度：H = 2^(25.2 - zoom) * 補正係数（実測 pitch=30° のデータに合わせて 0.83）
                                const H_canvas = Math.pow(2, 25.2 - Number(zoom)) * 0.83;
                                let ground = 0;
                                if (pitch > 0.01 && pitch < 89.99) {
                                    // 標高 0m で仮ターゲットを求め、その点の標高を取得してから ground を再計算
                                    const ground0 = H_canvas / Math.tan(pitch * Math.PI / 180);
                                    let terrainAlt = 0;
                                    if (ground0 > 0) {
                                        const target0 = destinationPoint(Number(lat), Number(lng), ground0, bearing);
                                        terrainAlt = await getTerrainElevation(target0.lat, target0.lng);
                                    }
                                    const H_effective = Math.max(0, H_canvas - terrainAlt);
                                    ground = H_effective / Math.tan(pitch * Math.PI / 180);
                                }
                                if (ground > 0) {
                                    const target = destinationPoint(Number(lat), Number(lng), ground, bearing);
                                    targetLat = target.lat;
                                    targetLng = target.lng;
                                }
                                // CANVAS zoom → Google Maps m 値（双方向で同じ定数使用）
                                const mGm = Math.max(1, Math.pow(2, (GM_M_TO_ZOOM_A - Number(zoom)) / GM_M_TO_ZOOM_B));
                                // 3D 傾斜があれば表示範囲を広げる（pitch 小さいほど遠くまで見える）
                                const pitchRad = Math.max(0.01, Math.min(89.99, pitch)) * Math.PI / 180;
                                const spread = Math.min(20, Math.max(1, 1 / Math.sin(pitchRad)));
                                const mGmSpread = mGm * spread;
                                targetUrl = `https://www.google.com/maps/@${Number(targetLat).toFixed(8)},${Number(targetLng).toFixed(8)},${Math.round(mGmSpread)}m?entry=ttu`;
                            } else if (currentUrlStr.includes('127.0.0.1:8510')) {
                                // CANVAS 用のクエリURLを組み立てる
                                let rawPitch = document.getElementById('input-pitch').value.trim() || '0.00';
                                let rawBearing = document.getElementById('input-bearing').value.trim() || '0.00';
                                const pitch = isNaN(Number(rawPitch)) ? '0.00' : Number(rawPitch).toFixed(2);
                                const bearing = isNaN(Number(rawBearing)) ? '0.00' : Number(rawBearing).toFixed(2);
                                targetUrl = `http://127.0.0.1:8510/?latitude=${lat}&longitude=${lng}&zoom=${zoom}&pitch=${pitch}&bearing=${bearing}`;
                            } else if (currentUrlStr.includes('index2.html')) {
                                // index2.htmlの場合は何もしない（設定画面などのため）
                            }
                        }
                    } catch(err) {
                        // パース失敗時はデフォルトのGoogle Mapsを使用
                    }

                    await window.__TAURI__.core.invoke('open_in_pane2', { url: targetUrl });
                    statusDiv.style.display = 'none';
                } catch (e) {
                    statusDiv.style.display = 'block';
                    statusDiv.style.color = '#dc2626';
                    statusDiv.textContent = "移動に失敗しました: " + e;
                }
            } else {
                statusDiv.style.display = 'block';
                statusDiv.style.color = '#dc2626';
                statusDiv.textContent = "Tauri環境で実行してください。";
            }
        }

        // 自動同期対象のGISタブに応じたダミーURLを返す（URL判定用）
        // 対象: CANVAS(cesium)、Google Maps(google)、Google Earth(googleearth)、Yahoo Map(yahoo)
        // 対象外は null を返し、handleAutoSyncTabChange では何もせず index2 側の通常タブ切り替えに任せる
        function getDummyUrlForTab(tabName) {
            switch (tabName) {
                case 'google':
                    return 'https://www.google.com/maps/';
                case 'googleearth':
                    return 'https://earth.google.com/web/';
                case 'yahoo':
                    return 'https://map.yahoo.co.jp/';
                case 'cesium':
                    return 'http://127.0.0.1:8510/';
                default:
                    return null;
            }
        }

        // タブ切り替え時の自動同期：切り替え前のURLから取得し、切り替え先に移動
        // 対象外タブでは緯度経度を反映せず、index2 側の通常タブ切り替え処理（移動先タブのデータ）に任せる
        async function handleAutoSyncTabChange(payload) {
            const { fromUrl, to } = payload;
            const statusDiv = document.getElementById('location-status');
            statusDiv.style.display = 'none';

            // 対象外タブは自動同期しない（index2 側の通常切り替えに任せる）
            if (!getDummyUrlForTab(to)) {
                return;
            }

            if (!fromUrl) {
                statusDiv.style.display = 'block';
                statusDiv.style.color = '#dc2626';
                statusDiv.textContent = '自動同期: 切り替え前のURLを取得できません。';
                return;
            }

            // 1. 切り替え前のタブのURLから座標を取得
            await getLocation(null, fromUrl);

            // 2. 取得できなければ処理を中止
            const lat = document.getElementById('input-lat').value.trim();
            const lng = document.getElementById('input-lng').value.trim();
            if (!lat || !lng) {
                statusDiv.style.display = 'block';
                statusDiv.style.color = '#dc2626';
                statusDiv.textContent = '自動同期: 座標を解析できませんでした。';
                return;
            }

            // 3. 切り替え先タブに応じたダミーURLを生成
            const dummyUrl = getDummyUrlForTab(to);

            // 4. 切り替え先タブに移動を適用
            try {
                await moveMap(null, dummyUrl);
                statusDiv.style.display = 'block';
                statusDiv.style.color = '#15803d';
                statusDiv.textContent = '自動同期: ' + to + ' へ移動しました。';
                setTimeout(() => { statusDiv.style.display = 'none'; }, 1500);
            } catch (e) {
                statusDiv.style.display = 'block';
                statusDiv.style.color = '#dc2626';
                statusDiv.textContent = '自動同期: 移動に失敗しました: ' + e;
            }
        }

        // 自動同期：現在のGISタブの座標を取得し、そのまま移動を適用する
        async function autoSync(event) {
            if (event) event.preventDefault();
            const statusDiv = document.getElementById('location-status');
            statusDiv.style.display = 'none';

            // 1. 現在のGISタブから座標を取得
            await getLocation(null);

            // 2. 取得に成功している場合のみ移動を適用
            const lat = document.getElementById('input-lat').value.trim();
            const lng = document.getElementById('input-lng').value.trim();
            if (lat && lng) {
                await moveMap(null);
            }

            // 3. 自動同期後は入力欄に戻す
            showManualInputs();
        }

                    } catch (e) {}
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(preloadBasicAuth, 1000);
        });
    </script>
</body>
