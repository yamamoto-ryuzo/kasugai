<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pane 2 - Center View</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0fdf4;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .header-tabs {
            height: 50px;
            background-color: #ffffff;
            border-bottom: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            overflow-x: auto;
            white-space: nowrap;
            min-width: 280px;
            flex-shrink: 0;
        }
        .container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 10px;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
            min-width: 280px;
            min-height: 0;
        }
        h1 {
            color: #15803d;
            font-size: 20px;
            margin-top: 0;
            border-bottom: 2px solid #22c55e;
            padding-bottom: 10px;
        }
        .badge {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            align-self: flex-start;
        }
        p {
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .interactive-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            /* 初期表示はおよそ10行分、必要に応じて縦方向にリサイズ可能にする */
            resize: vertical;
            min-height: calc(1.4em * 10);
            max-height: 60vh;
            overflow: auto;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }
        .btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }
        .btn:hover {
            background-color: #16a34a;
        }
        .btn-danger {
            background-color: #ef4444 !important;
        }
        .btn-danger:hover {
            background-color: #dc2626 !important;
        }
        .status-msg {
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }
        /* タブ用のスタイル */
        .tabs {
            display: flex;
            gap: 5px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            background-color: #f1f5f9;
            color: #1e293b;
        }
        .tab-btn.active {
            background-color: #22c55e;
            color: white;
        }
        .tab-btn.detached {
            background-color: #cbd5e1;
            color: #64748b;
            border: 1px dashed #64748b;
            cursor: default;
        }
        .tab-btn.detached:hover {
            background-color: #94a3b8;
            color: #ffffff;
            cursor: pointer;
        }
        /* タブの×（閉じる）ボタン */
        .tab-close {
            display: inline-block;
            margin-left: 6px;
            padding: 0 4px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.4;
            opacity: 0.55;
            cursor: pointer;
        }
        .tab-close:hover {
            opacity: 1;
            background-color: rgba(0, 0, 0, 0.15);
        }

        /* 水平スプリッター（pane2 / pane4 間） — 垂直スプリッターと同じ見た目に整える */
        #hsplit {
            height: 8px;
            background-color: #334155;
            cursor: row-resize;
            margin: 0 10px;
            border-radius: 4px;
            z-index: 9999;
            transition: background-color 0.15s;
            box-sizing: border-box;
            display: block;
            flex-shrink: 0;
        }
        #hsplit:hover,
        #hsplit.dragging {
            background-color: #3b82f6; /* ホバー・ドラッグ時に青く光らせる */
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
        }

    </style>
    <style>

    <script>
        let detachedTabs = new Set();
        let lastRightClickTime = 0;
        let lastRightClickTabId = null;
        let rightClickTimeout = null;

        function handleTabRightClick(e, tabId, title) {
            e.preventDefault();
            if (tabId === 'settings') return; // システム設定は独立ウィンドウ化の対象外
            
            // 連続右ダブルクリック（Macなどの2タップ）の検知ロジック
            const now = Date.now();
            
            // 既存のタイムアウトをクリア
            if (rightClickTimeout) {
                clearTimeout(rightClickTimeout);
                rightClickTimeout = null;
            }
            
            if (tabId === lastRightClickTabId && (now - lastRightClickTime) < 500) {
                // 右ダブルクリックが成立した場合、デフォルトブラウザで開く
                openTabInBrowser(tabId);
                lastRightClickTime = 0;
                lastRightClickTabId = null;
            } else {
                lastRightClickTabId = tabId;
                lastRightClickTime = now;
                
                // 右クリック：少し待ってダブルクリックかどうか判定
                rightClickTimeout = setTimeout(() => {
                    // タイムアウトした場合はシングルクリックとして処理（単独ウインドウで開く）
                    detachTab(tabId, title);
                    rightClickTimeout = null;
                    lastRightClickTime = 0;
                    lastRightClickTabId = null;
                }, 300); // 300ms待機
            }
        }

        async function detachTab(tabId, title) {
            if (tabId === 'settings') return; // システム設定は独立ウィンドウ化の対象外
            if (window.__TAURI__ && window.__TAURI__.core) {
                const url = await getTabUrl(tabId);
                // WebviewのIDを正しく渡す (例: "pane2_box")
                const wvId = 'pane2_' + tabId;
                
                // 専用画面として独立ウィンドウを開く/フォーカスする
                await window.__TAURI__.core.invoke('detach_window', { 
                    label: wvId, 
                    url: url,
                    title: title || 'Kasugai Dedicated Window'
                });
                
                // Rust側にBounds再計算を促す
                await window.__TAURI__.core.invoke('update_splitter', { ratio1: -1, ratio2: -1 });

                // UI上も独立状態を反映
                detachedTabs.add(tabId);
                const btn = document.getElementById('tab-' + tabId);
                if (btn) btn.classList.add('detached');
            }
        }

        // --- タブの非表示（×で閉じて画面1へ移動）管理 ---
        const HIDEABLE_TAB_TITLES = {
            'box': '📦 BOX',
            'google': '🗺️ Google Map',
            'googleearth': '🌍 Google Earth',
            'yahoo': '🗾 Yahoo Map',
            'cesium': '🌌 CesiumJS',
            'reearth': '🌐 Re:Earth'
        };
        let hiddenTabs = new Set();
        try {
            hiddenTabs = new Set(JSON.parse(localStorage.getItem('pane2_hidden_tabs') || '[]'));
        } catch (e) { hiddenTabs = new Set(); }

        function applyHiddenTabs() {
            Object.keys(HIDEABLE_TAB_TITLES).forEach(id => {
                const btn = document.getElementById('tab-' + id);
                if (btn) btn.style.display = hiddenTabs.has(id) ? 'none' : '';
            });
            // Google Map再読み込みボタンはGoogle Mapタブと連動して表示・非表示
            const reloadBtn = document.getElementById('tab-google-reload');
            if (reloadBtn) reloadBtn.style.display = hiddenTabs.has('google') ? 'none' : '';
        }

        function persistHiddenTabs() {
            try { localStorage.setItem('pane2_hidden_tabs', JSON.stringify([...hiddenTabs])); } catch (e) {}
        }

        // 画面1へ非表示タブの一覧を通知（画面2のタブの並び順で送る）
        function broadcastHiddenTabs() {
            if (window.__TAURI__ && window.__TAURI__.event) {
                const tabs = Object.keys(HIDEABLE_TAB_TITLES)
                    .filter(id => hiddenTabs.has(id))
                    .map(id => ({ id: id, title: HIDEABLE_TAB_TITLES[id] }));
                window.__TAURI__.event.emit('pane2_hidden_tabs_state', { tabs: tabs });
            }
        }

        // タブの×クリック：非表示にして画面1へ移動
        function closeTab(e, tabId) {

        function parseIni(text) {
            const lines = text.split(/\r?\n/);
            const out = {};
            for (let l of lines) {
                l = l.trim();
                if (!l) continue;
                if (l.startsWith(';') || l.startsWith('#')) continue;
                if (l.startsWith('[') && l.endsWith(']')) continue;
                const idx = l.indexOf('=');
                if (idx === -1) continue;
                let k = l.slice(0, idx).trim();
                let v = l.slice(idx+1).trim();
                if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
                    v = v.slice(1, -1);
            }
                out[k] = v;
            }
            return out;
        }

        // pane4 用の水平スプリッター処理
        (function() {
            const hsplit = document.getElementById('hsplit');

            let currentRatio = 0.2;
            let fullWindowHeight = 0;
            let isDragging = false;
            let overlay = null;
            let rafId = null;
            let lastY = 0;
            let containerRafId = null;
            // ダブルクリック時の誤ドラッグ防止用（一定距離動くまでドラッグ扱いにしない）
            let dragMoved = false;
            let dragStartY = 0;
            const DRAG_THRESHOLD = 4;

            function clampRatio(r) {
                return Math.min(Math.max(r, 0.0), 1.0);
            }

            function clampDragRatio(r) {
                return Math.min(Math.max(r, 0.05), 0.6);
            }

            function recomputeFullWindowHeight() {
                const denom = 1 - currentRatio;
                fullWindowHeight = (denom > 0) ? (window.innerHeight / denom) : window.innerHeight;
            }

            function applyPane4Ratio(ratio, notify=true) {
                currentRatio = clampRatio(ratio);
                localStorage.setItem('pane4_ratio', String(clampDragRatio(currentRatio)));
                if (containerRafId) cancelAnimationFrame(containerRafId);
                containerRafId = requestAnimationFrame(() => {
                    containerRafId = null;
                    recomputeFullWindowHeight();
                });
                if (notify && window.__TAURI__ && window.__TAURI__.core) {
                    const r = clampDragRatio(currentRatio);
                    try { window.__TAURI__.core.invoke('update_pane4_ratio', { ratio: r }); } catch(e){}
                }
            }

            // 初期値の復元
            window.addEventListener('DOMContentLoaded', () => {
                const stored = parseFloat(localStorage.getItem('pane4_ratio') || '0.2');
                applyPane4Ratio(isNaN(stored) ? 0.2 : stored, true);
            });

            // Rust 側からの比率更新を受け取って UI を復元する
            if (window.__TAURI__ && window.__TAURI__.event) {
                window.__TAURI__.event.listen('update_splitter_ui', (event) => {
                    try {
                        if (event.payload && typeof event.payload.pane4_ratio !== 'undefined') {
                            const p4 = Number(event.payload.pane4_ratio) || 0.0;
                            if (isDragging) {
                                // ドラッグ中は自前で container を更新するため比率のみ保持
                                currentRatio = clampRatio(p4);
                            } else {
                                applyPane4Ratio(p4, false);
                            }
                        }
                    } catch (e) { /* ignore malformed payloads */ }
                });
            }

            // リサイズ時の再計算
            window.addEventListener('resize', () => {
                if (isDragging) return;
                const stored = parseFloat(localStorage.getItem('pane4_ratio') || '0.2');
                applyPane4Ratio(isNaN(stored) ? 0.2 : stored, false);
            });

            function updateFromY(y) {
                if (!fullWindowHeight) return;
                let r = 1 - y / fullWindowHeight;
                r = clampDragRatio(r);
                currentRatio = r;
                if (window.__TAURI__ && window.__TAURI__.core) {
                    try { window.__TAURI__.core.invoke('update_pane4_ratio', { ratio: r }); } catch(e){}
                }
            }

            function flushUpdate() {
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
                updateFromY(lastY);
            }

            // 水平スプリッターのダブルクリックで画面4の表示・非表示をトグル
            hsplit.addEventListener('dblclick', (e) => {
                e.preventDefault();
                e.stopPropagation();

                if (hsplit) hsplit.classList.add('dragging');

                    position: 'fixed', top: '0', left: '0', right: '0', bottom: '0',
                    cursor: 'row-resize', zIndex: '9998', background: 'transparent'
                });
                document.body.appendChild(overlay);

                const pane2H = window.innerHeight;
                const denom = 1 - currentRatio;
                fullWindowHeight = (denom > 0) ? (pane2H / denom) : pane2H;
                lastY = e.clientY;

                try { hsplit.setPointerCapture(e.pointerId); } catch(_) {}
            });

            document.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                if (!dragMoved) {
                    if (Math.abs(e.clientY - dragStartY) < DRAG_THRESHOLD) return;
                    dragMoved = true;
                }
                lastY = e.clientY;
                if (!rafId) {
                    rafId = requestAnimationFrame(() => {
                        rafId = null;
                        if (!isDragging) return;
                        updateFromY(lastY);
                    });
                }
            }, { passive: true });

            document.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                document.body.style.userSelect = '';
                document.body.style.cursor = '';
                if (hsplit) hsplit.classList.remove('dragging');
                try { hsplit.releasePointerCapture && hsplit.releasePointerCapture(e.pointerId); } catch(_) {}
                if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
                overlay = null;

                // 実際にドラッグした場合のみ比率を確定する（クリック・ダブルクリックでは変更しない）
                if (dragMoved) {
                    lastY = e.clientY;
                    flushUpdate();
                    // 最終値を永続化
                    localStorage.setItem('pane4_ratio', String(clampDragRatio(currentRatio)));
                }

            document.addEventListener('pointercancel', (e) => {
                if (!isDragging) return;
                isDragging = false;
                document.body.style.userSelect = '';
                document.body.style.cursor = '';

        async function checkForUpdates(showNotification = true) {

                    if (showNotification) {

                    }
                    return { available: true, version: update.version, notes };
                } else {
                    if (showNotification) {
                        console.log('更新は利用可能ではありません');

                    return { available: false };

                console.error('更新チェックエラー:', error);

                    if (statusEl) {
                        statusEl.textContent = '更新チェック中にエラーが発生しました';

                return { available: false, error: error.message };

                        case 'Progress':

                            break;

                            console.log('ダウンロード完了');

                    rid: update.rid,
                    onEvent,
                    headers: []

                console.log('更新インストール完了');
                await window.__TAURI__.core.invoke('plugin:process|relaunch');
            } catch (error) {
                console.error('更新インストールエラー:', error);
                alert('更新のインストールに失敗しました: ' + error.message);
            }
        }

        // 手動更新チェック
        async function manualUpdateCheck() {
            const statusEl = document.getElementById('update-status');
            if (statusEl) {
                statusEl.textContent = '更新を確認中...';
                statusEl.style.color = '#64748b';
            }

            const result = await checkForUpdates(false);

            if (statusEl) {
                if (result.available) {
                    statusEl.textContent = `バージョン ${result.version} が利用可能です`;
                    statusEl.style.color = '#22c55e';
                    if (confirm(`新しいバージョン ${result.version} が利用可能です\n\n${result.notes}\n\n今すぐ更新しますか？`)) {
                        if (isTauriEnvironment()) {
                            const update = await window.__TAURI__.core.invoke('plugin:updater|check', { headers: [] });
                            if (update) {
                                await performUpdate(update);
                            }
                        } else {
                            alert('更新はデスクトップ版でのみ実行できます。');
                        }
                    }
                } else if (result.error && result.error !== 'not_tauri') {
                    statusEl.textContent = 'エラー: ' + result.error;
                    statusEl.style.color = '#ef4444';
                } else if (!result.available) {
                    statusEl.textContent = isTauriEnvironment() ? '最新バージョンを使用しています' : '更新機能はデスクトップ版でのみ利用可能です';
                    statusEl.style.color = isTauriEnvironment() ? '#22c55e' : '#64748b';
                }
            }
        }

        // ページ読み込み時に更新チェックを実行（少し遅延させてパフォーマンスに影響しないように）
        setTimeout(async () => {
            // 現在のバージョンを表示
            // window.__TAURI__.app は withGlobalTauri: true で @tauri-apps/api から注入される
            try {
                const versionEl = document.getElementById('current-version');
                if (isTauriEnvironment() && window.__TAURI__.app && typeof window.__TAURI__.app.getVersion === 'function') {
                    const currentVersion = await window.__TAURI__.app.getVersion();
                    if (versionEl) versionEl.textContent = currentVersion;
                } else {
                    if (versionEl) versionEl.textContent = 'web';
                }
            } catch (error) {
                console.error('バージョン取得エラー:', error);
            }

            const autoUpdateCheck = document.getElementById('auto-update-check');
            if (autoUpdateCheck && autoUpdateCheck.value === 'enabled') {
                await checkForUpdates(true);
            }
        }, 5000); // 5秒後にチェック

        // --- QGISランチャー設定 ---
        let qgisLauncherPath = null;

        async function initQgisSettings() {
            const input = document.getElementById('qgis-install-path-input');
            const status = document.getElementById('qgis-status');
            if (!input || !window.__TAURI__ || !window.__TAURI__.core) {
                if (status) status.textContent = 'Tauri環境で実行してください';
                return;
            }

            const savedPath = localStorage.getItem('qgis_launcher_install_path') || '';
            if (savedPath) {
                input.value = savedPath;
                await updateQgisStatus(savedPath);
            } else {
                try {
                    const defaultDir = await window.__TAURI__.core.invoke('get_qgis_launcher_default_dir');
                    input.value = defaultDir;
                    await updateQgisStatus(defaultDir);
                } catch (e) {
                    console.warn('QGISデフォルトパス取得失敗:', e);
                }
            }
        }

        function getQgisInstallPath() {
            const input = document.getElementById('qgis-install-path-input');
            return input ? input.value.trim() : '';
        }

        async function updateQgisStatus(path) {
            const btn = document.getElementById('qgis-install-btn');
            const status = document.getElementById('qgis-status');
            if (!btn || !window.__TAURI__ || !window.__TAURI__.core) return;

            try {
                const exePath = await window.__TAURI__.core.invoke('get_qgis_launcher_status', { path: path || getQgisInstallPath() });
                if (exePath) {
                    qgisLauncherPath = exePath;
                    btn.textContent = '起動';
                    btn.title = 'QGIS Launcher を起動';
                    if (status) { status.textContent = 'インストール済: ' + exePath; status.style.color = '#15803d'; }
                } else {
                    qgisLauncherPath = null;
                    btn.textContent = 'インストール';
                    btn.title = 'QGIS Launcher をインストール';
                    if (status) { status.textContent = '未インストール'; status.style.color = '#64748b'; }
                }
            } catch (e) {
                qgisLauncherPath = null;
                btn.textContent = 'インストール';
                if (status) { status.textContent = 'エラー: ' + e; status.style.color = '#dc2626'; }
            }
        }

        async function handleQgisLauncher(event) {
            if (event) event.preventDefault();
            const btn = document.getElementById('qgis-install-btn');
            const status = document.getElementById('qgis-status');
            if (!window.__TAURI__ || !window.__TAURI__.core) return;

            const path = getQgisInstallPath();
            localStorage.setItem('qgis_launcher_install_path', path);

            if (qgisLauncherPath) {
                try {
                    if (status) { status.textContent = '起動中...'; status.style.color = '#2563eb'; }
                    await window.__TAURI__.core.invoke('launch_qgis_launcher', { path });
                    if (status) { status.textContent = '起動しました'; status.style.color = '#15803d'; }
                } catch (e) {
                    if (status) { status.textContent = '起動失敗: ' + e; status.style.color = '#dc2626'; }
                }
                return;
            }

            try {
                btn.disabled = true;
                if (status) { status.textContent = 'ダウンロード中...'; status.style.color = '#2563eb'; }
                const result = await window.__TAURI__.core.invoke('install_qgis_launcher', { path });
                qgisLauncherPath = result;
                btn.textContent = '起動';
                btn.title = 'QGIS Launcher を起動';
                if (status) { status.textContent = '完了: ' + result; status.style.color = '#15803d'; }
            } catch (e) {
                btn.textContent = '再試行';
                if (status) { status.textContent = '失敗: ' + e; status.style.color = '#dc2626'; }
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('qgis-install-path-input')?.addEventListener('change', async (e) => {
            localStorage.setItem('qgis_launcher_install_path', e.target.value.trim());
            await updateQgisStatus(e.target.value.trim());
        });

    </script>
</body>
</html>
