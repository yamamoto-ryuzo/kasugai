<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasugai Splitter Base</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* スプリッターの背景（隙間の色） */
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        /* スプリッターバーのデザイン */
        .splitter {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 8px;
            background-color: #334155;
            cursor: col-resize;
            z-index: 9999;
            transition: background-color 0.15s;
        }
        .splitter:hover, .splitter.dragging {
            background-color: #3b82f6; /* ホバー・ドラッグ時に青く光らせる */
        }
        /* 画面1が閉じている時のスプリッターを分かりやすくする装飾 */
        .splitter.splitter1-closed {
            background-color: #3b82f6; /* 閉じている時は青く光らせてアピール */
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
            border-right: 1px solid #ffffff;
        }
    </style>
</head>
<body>
    <div id="splitter1" class="splitter"></div>
    <div id="splitter2" class="splitter"></div>

    <script>
        const splitter1 = document.getElementById('splitter1');
        const splitter2 = document.getElementById('splitter2');

        let ratio1 = 0.1;
        let ratio2 = 0.8;
        let pane4Ratio = 0.2;
        const splitterWidth = 8;

        // 前回終了時のレイアウト状態（分割比率）を localStorage から復元する。
        // 設定で「既定画面で開始」が選ばれている場合は復元しない。
        function layoutRestoreEnabled() {
            try { return localStorage.getItem('kasugai_restore_state') !== 'default'; }
            catch (e) { return true; }
        }
        function saveLayoutState() {
            try { localStorage.setItem('kasugai_layout', JSON.stringify({ ratio1, ratio2, pane4Ratio })); }
            catch (e) {}
        }
        try {
            if (layoutRestoreEnabled()) {
                const saved = JSON.parse(localStorage.getItem('kasugai_layout') || 'null');
                if (saved) {
                    if (typeof saved.ratio1 === 'number') ratio1 = saved.ratio1;
                    if (typeof saved.ratio2 === 'number') ratio2 = saved.ratio2;
                    if (typeof saved.pane4Ratio === 'number') pane4Ratio = saved.pane4Ratio;
                }
            }
        } catch (e) {}
        const sh = splitterWidth / 2;

        // 初期配置をセット
        function updateSplitterElements() {
            const w = window.innerWidth;
            
            // 画面1が開いている時（0.0以外の時）は、常に最小幅 100px で完全に固定する
            if (ratio1 !== 0.0) {
                ratio1 = 100 / w;
            }

            splitter1.style.left = (w * ratio1 - sh) + 'px';
            // スプリッター2は最大化時（ratio2=1.0等）でも常に全幅が画面内に見えるようにクランプする
            let s2left = w * ratio2 - sh;
            if (s2left < 0) s2left = 0;
            if (s2left > w - splitterWidth) s2left = w - splitterWidth;
            splitter2.style.left = s2left + 'px';

            // 画面1が閉じている（0.0）の場合にスプリッター1を強調する
            if (ratio1 === 0.0) {
                splitter1.classList.add('splitter1-closed');
            } else {
                splitter1.classList.remove('splitter1-closed');
            }
        }

        updateSplitterElements();
        window.addEventListener('resize', updateSplitterElements, { passive: true });

        // ウィンドウサイズ・最大化状態の保存/復元
        async function saveWindowState() {
            if (!window.__TAURI__ || !window.__TAURI__.window) return;
            try {
                const w = window.__TAURI__.window.getCurrentWindow();
                const size = await w.outerSize();
                const maximized = await w.isMaximized();
                localStorage.setItem('kasugai_window', JSON.stringify({ w: size.width, h: size.height, maximized }));
            } catch (e) {}
        }
        window.addEventListener('resize', () => { saveWindowState(); }, { passive: true });

        (async function restoreInitialState() {
            if (!layoutRestoreEnabled()) return;
            if (!window.__TAURI__ || !window.__TAURI__.core) return;
            try {
                await window.__TAURI__.core.invoke('update_splitter', { ratio1, ratio2 });
                await window.__TAURI__.core.invoke('update_pane4_ratio', { ratio: pane4Ratio });
                const ws = JSON.parse(localStorage.getItem('kasugai_window') || 'null');
                if (ws && ws.maximized === false && ws.w > 0 && ws.h > 0 && window.__TAURI__.window) {
                    const w = window.__TAURI__.window.getCurrentWindow();
                    await w.unmaximize();
                    await w.setSize(new window.__TAURI__.window.PhysicalSize(ws.w, ws.h));
                }
            } catch (e) {}
        })();

        let activeSplitter = null;
        // ダブルクリック時の誤ドラッグ防止用（一定距離動くまでドラッグ扱いにしない）
        let dragStartX = 0;
        let dragStartY = 0;
        let dragMoved = false;
        const DRAG_THRESHOLD = 4;

        // ドラッグ状態を子Webview全体に通知
        function notifyDragStart() {
            if (window.__TAURI__ && window.__TAURI__.event) {
                window.__TAURI__.event.emit('splitter_drag_start', {
                    activeSplitter: activeSplitter,
                    ratio1: ratio1,
                    ratio2: ratio2
                });
            }
        }

        function notifyDragEnd() {
            if (window.__TAURI__ && window.__TAURI__.event) {
                window.__TAURI__.event.emit('splitter_drag_end');
            }
        }

        function onMouseDown(e, splitterNum) {
            e.preventDefault();
            activeSplitter = splitterNum;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragMoved = false;
            document.body.style.cursor = 'col-resize';
            if (splitterNum === 1) splitter1.classList.add('dragging');
            if (splitterNum === 2) splitter2.classList.add('dragging');

            notifyDragStart();
        }

        splitter1.addEventListener('mousedown', (e) => onMouseDown(e, 1));
        splitter2.addEventListener('mousedown', (e) => onMouseDown(e, 2));

        // スプリッターのダブルクリックによる表示・非表示トグル
        splitter1.addEventListener('dblclick', () => {
            if (window.__TAURI__ && window.__TAURI__.core) {
                window.__TAURI__.core.invoke('pane_dblclick', { pane: 'pane1' });
            }
        });
        splitter2.addEventListener('dblclick', () => {
            if (window.__TAURI__ && window.__TAURI__.core) {
                window.__TAURI__.core.invoke('toggle_pane3');
            }
        });

        // マウス位置に基づくスプリッター比率の更新ロジック
        function handleMove(clientX, clientY) {
            if (!activeSplitter) return;

            // クリック（ダブルクリック含む）時のわずかなマウス移動では比率を変更しない
            if (!dragMoved) {
                if (Math.abs(clientX - dragStartX) < DRAG_THRESHOLD &&
                    Math.abs(clientY - dragStartY) < DRAG_THRESHOLD) return;
                dragMoved = true;
            }

            // 水平スプリッター(画面2下部 pane4) の場合は Y 座標で比率を計算
            if (activeSplitter === 'hsplit') {
                const h = window.innerHeight;
                let newRatio = (h - clientY) / h;
                if (newRatio < 0.05) newRatio = 0.05;
                if (newRatio > 0.6) newRatio = 0.6;
                pane4Ratio = newRatio;
                // Rust 側の pane4 比率更新コマンドを呼ぶ
                if (window.__TAURI__ && window.__TAURI__.core) {
                    window.__TAURI__.core.invoke('update_pane4_ratio', { ratio: newRatio });
                }
                return;
            }

            const w = window.innerWidth;
            let newRatio = clientX / w;

            if (activeSplitter === 1) {
                // 100px（最小幅）未満の縮尺になったら左端にスナップ（クローズ）する
                const closeThreshold = 100 / w;
                if (newRatio < closeThreshold) {
                    newRatio = 0.0;
                } else {
                    newRatio = 100 / w; // 開いている時は常に最小幅（100px）で常時固定にする
                }
                ratio1 = newRatio;
            } else if (activeSplitter === 2) {
                const minRatio = 0.05;
                if (newRatio < ratio1 + minRatio) newRatio = ratio1 + minRatio;
                if (newRatio > 1 - minRatio) newRatio = 1 - minRatio;
                ratio2 = newRatio;
            }

            updateSplitterElements();

            // Rustバックエンドを呼び出してWebviewをリサイズ
            if (window.__TAURI__ && window.__TAURI__.core) {
                window.__TAURI__.core.invoke('update_splitter', { ratio1, ratio2 });
            }
        }

        // 自身のWebview上での動き
        window.addEventListener('mousemove', (e) => {
            if (!activeSplitter) return;
            handleMove(e.clientX, e.clientY);
        }, { passive: true });

        // ドラッグ終了処理
        function endDrag() {
            if (!activeSplitter) return;

            splitter1.classList.remove('dragging');
            splitter2.classList.remove('dragging');
            activeSplitter = null;
            document.body.style.cursor = 'default';

            notifyDragEnd();
            saveLayoutState();
        }

        window.addEventListener('mouseup', endDrag, { passive: true });

        // --- Tauri イベントシステムによる他Webviewからのマウスクリップの中継 ---
        if (window.__TAURI__ && window.__TAURI__.event) {
            // Rustから発行された比率更新イベントを受け取る
            window.__TAURI__.event.listen('update_splitter_ui', (event) => {
                if (event.payload) {
                    ratio1 = event.payload.ratio1;
                    ratio2 = event.payload.ratio2;
                    if (typeof event.payload.pane4_ratio === 'number') pane4Ratio = event.payload.pane4_ratio;
                    updateSplitterElements();
                    saveLayoutState();
                }
            });

            // 他のWebviewで検知されたmousemoveを受け取る（絶対座標 screenX/screenY を クライアント座標に変換）
            window.__TAURI__.event.listen('global_mousemove', (event) => {
                if (!activeSplitter) return;
                
                const clientX = event.payload.screenX - window.screenX;
                const clientY = event.payload.screenY - window.screenY;
                handleMove(clientX, clientY);
            });

            // 他のWebviewでマウスボタンが離された場合
            window.__TAURI__.event.listen('global_mouseup', () => {
                endDrag();
            });

            // 子Webview側での比率変更の同期（もしあれば）
            window.__TAURI__.event.listen('request_ratios', () => {
                window.__TAURI__.event.emit('sync_ratios', { ratio1, ratio2 });
            });
        }
    </script>
</body>
</html>
