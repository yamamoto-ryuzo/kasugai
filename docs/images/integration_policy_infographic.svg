<svg width="1600" height="960" viewBox="0 0 1600 960" xmlns="http://www.w3.org/2000/svg" font-family="Yu Gothic UI, Meiryo, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9333ea"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="960" fill="#ffffff"/>

  <!-- header -->
  <rect x="0" y="0" width="1600" height="110" fill="url(#headerGrad)"/>
  <text x="60" y="52" font-size="36" font-weight="bold" fill="#ffffff">KASUGAI 外部連携方針</text>
  <text x="60" y="90" font-size="20" fill="#e0f2fe">本体はハブに徹し、専門処理は API サイドカーへ ― 標準 API（HTTP / MCP / WebSocket）で繋ぐ</text>
  <text x="1540" y="90" font-size="15" fill="#dbeafe" text-anchor="end">最終更新 2026-07-26</text>

  <!-- ===== HOST BOX ===== -->
  <rect x="60" y="170" width="430" height="430" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="60" y="170" width="430" height="64" rx="18" fill="#2563eb"/>
  <rect x="60" y="210" width="430" height="24" fill="#2563eb"/>
  <text x="275" y="202" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">KASUGAI 本体</text>
  <text x="275" y="226" font-size="14" fill="#dbeafe" text-anchor="middle">Tauri v2 × Rust ― UI / オーケストレーション層</text>

  <circle cx="120" cy="290" r="26" fill="#2563eb"/>
  <text x="120" y="300" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">脳</text>
  <text x="165" y="284" font-size="19" font-weight="bold" fill="#1e3a8a">コア（Rust）</text>
  <text x="165" y="309" font-size="15" fill="#334155">窓 / WebView 制御・keyring・地図同期</text>

  <circle cx="120" cy="385" r="26" fill="#0284c7"/>
  <text x="120" y="395" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">窓</text>
  <text x="165" y="379" font-size="19" font-weight="bold" fill="#1e3a8a">表示ペイン / タブ</text>
  <text x="165" y="404" font-size="15" fill="#334155">サイドカーの UI を URL で読み込むだけ</text>

  <circle cx="120" cy="480" r="26" fill="#64748b"/>
  <text x="120" y="490" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">起</text>
  <text x="165" y="474" font-size="19" font-weight="bold" fill="#1e3a8a">ネイティブ連携</text>
  <text x="165" y="499" font-size="15" fill="#334155">QGIS ランチャー等は別プロセスで維持</text>

  <text x="275" y="565" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">業務ロジックは本体に埋め込まない</text>

  <!-- ===== ARROW HOST -> SIDECAR ===== -->
  <path d="M 500 385 L 630 385" stroke="#0284c7" stroke-width="5" marker-end="url(#arrowBlue)" fill="none"/>
  <text x="568" y="360" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">HTTP / WebSocket</text>
  <text x="568" y="418" font-size="14" fill="#0369a1" text-anchor="middle">127.0.0.1 のみ</text>

  <!-- ===== SIDECAR BOX ===== -->
  <rect x="640" y="150" width="480" height="500" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="3"/>
  <rect x="640" y="150" width="480" height="64" rx="18" fill="#0d9488"/>
  <rect x="640" y="190" width="480" height="24" fill="#0d9488"/>
  <text x="880" y="182" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">API サイドカー</text>
  <text x="880" y="206" font-size="14" fill="#ccfbf1" text-anchor="middle">例：kasugai_box（127.0.0.1:8410）― 言語・FW 不問</text>

  <circle cx="700" cy="265" r="24" fill="#0d9488"/>
  <text x="700" y="272" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">UI</text>
  <text x="742" y="260" font-size="18" font-weight="bold" fill="#134e4a">UI を自身で配信</text>
  <text x="742" y="284" font-size="14" fill="#334155">GET /ui ― KASUGAI はそれを表示するだけ</text>

  <circle cx="700" cy="350" r="24" fill="#059669"/>
  <text x="700" y="357" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">API</text>
  <text x="742" y="345" font-size="18" font-weight="bold" fill="#134e4a">REST API + OpenAPI</text>
  <text x="742" y="369" font-size="14" fill="#334155">/api/v1/... ― 長時間処理はジョブ ID で追跡</text>

  <circle cx="700" cy="435" r="24" fill="#e11d48"/>
  <text x="700" y="444" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">健</text>
  <text x="742" y="430" font-size="18" font-weight="bold" fill="#134e4a">ヘルスチェック</text>
  <text x="742" y="454" font-size="14" fill="#334155">GET /health ― 起動・バージョン確認</text>

  <circle cx="700" cy="520" r="24" fill="#7c3aed"/>
  <text x="700" y="526" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">MCP</text>
  <text x="742" y="515" font-size="18" font-weight="bold" fill="#134e4a">MCP サーバー（推奨）</text>
  <text x="742" y="539" font-size="14" fill="#334155">POST /mcp ― AI エージェント連携用</text>

  <circle cx="700" cy="600" r="24" fill="#b45309"/>
  <text x="700" y="609" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">鍵</text>
  <text x="742" y="595" font-size="18" font-weight="bold" fill="#134e4a">認証・機密情報</text>
  <text x="742" y="619" font-size="14" fill="#334155">API キーは keyring で管理・UI に渡さない</text>

  <!-- ===== EXTERNAL SERVICES ===== -->
  <rect x="1250" y="200" width="290" height="160" rx="18" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/>
  <circle cx="1310" cy="265" r="28" fill="#7c3aed"/>
  <text x="1310" y="275" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">雲</text>
  <text x="1355" y="260" font-size="20" font-weight="bold" fill="#581c87">外部サービス</text>
  <text x="1355" y="286" font-size="14" fill="#334155">Box・Gemini など</text>
  <text x="1395" y="333" font-size="14" fill="#7e22ce" text-anchor="middle">通信はサイドカー内で完結</text>

  <path d="M 1130 300 L 1240 290" stroke="#9333ea" stroke-width="4" marker-end="url(#arrowPurple)" fill="none"/>
  <text x="1185" y="272" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="middle">認証付き API</text>

  <!-- ===== AI AGENT ===== -->
  <rect x="1250" y="440" width="290" height="160" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <circle cx="1310" cy="505" r="28" fill="#d97706"/>
  <text x="1310" y="513" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">AI</text>
  <text x="1355" y="500" font-size="20" font-weight="bold" fill="#78350f">AI エージェント</text>
  <text x="1355" y="526" font-size="14" fill="#334155">LLM / エージェント連携</text>
  <text x="1395" y="573" font-size="14" fill="#b45309" text-anchor="middle">HTTP 基盤で将来規格にも対応</text>

  <path d="M 1240 510 L 1130 518" stroke="#d97706" stroke-width="4" marker-end="url(#arrowAmber)" fill="none"/>
  <text x="1185" y="495" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">MCP</text>

  <!-- ===== PRINCIPLES ===== -->
  <text x="60" y="720" font-size="24" font-weight="bold" fill="#1e293b">基本原則 3 か条</text>

  <rect x="60" y="745" width="470" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="110" cy="792" r="24" fill="#2563eb"/>
  <text x="110" y="801" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="150" y="788" font-size="19" font-weight="bold" fill="#1e3a8a">本体は UI / ハブに徹する</text>
  <text x="150" y="817" font-size="15" fill="#334155">専門処理はサイドカーへ。本体は繋ぐだけ</text>

  <rect x="565" y="745" width="470" height="130" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="615" cy="792" r="24" fill="#0d9488"/>
  <text x="615" y="801" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="655" y="788" font-size="19" font-weight="bold" fill="#134e4a">標準規格のみ採用</text>
  <text x="655" y="817" font-size="15" fill="#334155">HTTP/REST・OpenAPI・MCP・WebSocket</text>

  <rect x="1070" y="745" width="470" height="130" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="1120" cy="792" r="24" fill="#dc2626"/>
  <text x="1120" y="801" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="1160" y="788" font-size="19" font-weight="bold" fill="#7f1d1d">127.0.0.1 固定 &amp; 機密分離</text>
  <text x="1160" y="817" font-size="15" fill="#334155">外部公開せず、API キーはサイドカー内で保持</text>

  <text x="800" y="930" font-size="14" fill="#64748b" text-anchor="middle">詳細は KASUGAI_INTEGRATION_POLICY.md 本文を参照</text>
</svg>
