# Security checks for this repository (workspace-wide convention).
# Install once:  python -m pip install pre-commit && python -m pre_commit install
# Manual run:    python -m pre_commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(\.secrets\.baseline|package-lock\.json|Cargo\.lock)$'

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-lll']

  - repo: local
    hooks:
      - id: cargo-audit
        name: cargo audit (src-tauri)
        entry: python scripts/security_audit.py --cargo kasugai/src-tauri
        language: system
        pass_filenames: false
        files: '^kasugai/src-tauri/Cargo\.(toml|lock)$'
      - id: npm-audit
        name: npm audit (kasugai)
        entry: python scripts/security_audit.py --npm kasugai --npm .
        language: system
        pass_filenames: false
        files: '(^|/)package(-lock)?\.json$'
